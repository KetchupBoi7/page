<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%2306090f'/%3E%3Cg fill='none' stroke='%237ab8ff' stroke-width='3' stroke-linecap='round'%3E%3Ccircle cx='24' cy='17' r='6.5'/%3E%3Cpath d='M12 38c0-7.2 5.4-11.5 12-11.5S36 30.8 36 38'/%3E%3C/g%3E%3C/svg%3E">
<style>
@property --accent { syntax: '<color>'; inherits: true; initial-value: #7ab8ff; }

:root {
  --s: 1;
  --u: calc(var(--s) * 1px);
  --accent: #7ab8ff;
  --a90: color-mix(in srgb, var(--accent) 90%, transparent);
  --a70: color-mix(in srgb, var(--accent) 70%, transparent);
  --a55: color-mix(in srgb, var(--accent) 55%, transparent);
  --a35: color-mix(in srgb, var(--accent) 35%, transparent);
  --a30: color-mix(in srgb, var(--accent) 30%, transparent);
  --a22: color-mix(in srgb, var(--accent) 22%, transparent);
  --a16: color-mix(in srgb, var(--accent) 16%, transparent);
  --a12: color-mix(in srgb, var(--accent) 12%, transparent);
  --a08: color-mix(in srgb, var(--accent) 8%, transparent);
  /* accent-tinted text that stays readable even for dark swatches */
  --a-ink: color-mix(in srgb, var(--accent) 72%, #eef3fa);
  --text: #eef3fa;
  --text-90: rgba(238, 243, 250, 0.9);
  --muted: rgba(190, 212, 240, 0.78);
  --faint: rgba(238, 243, 250, 0.6);
  --line: rgba(255, 255, 255, 0.09);
  --ease: cubic-bezier(0.22, 1, 0.3, 1);
  --fs-label: calc(12 * var(--u));
  --fs-ui: calc(15 * var(--u));
  --fs-body: calc(18 * var(--u));
  --fs-item: calc(21 * var(--u));
  --fs-title: calc(34 * var(--u));
  --fs-hero: calc(44 * var(--u));
  --font: 'Jost', 'Noto Sans Tamil', 'Nirmala UI', 'Tamil Sangam MN', 'Segoe UI', system-ui, sans-serif;
  --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, monospace;
  /* layout (written by JS on resize) */
  --content-x: 400px;
  --panel-top: 14vh;
  --panel-bottom: 13vh;
  --panel-r: 60px;
  transition: --accent 0.5s ease;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #04060a; overflow: hidden; }
body {
  color: var(--text); font-family: var(--font); font-weight: 300;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg { display: block; }

@keyframes iconPulse {
  0%, 100% { filter: drop-shadow(0 0 6px var(--a55)); }
  50% { filter: drop-shadow(0 0 16px var(--a90)); }
}
@keyframes menuFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes hintFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

[data-hide-scrollbar], .scroll { scrollbar-width: none; -ms-overflow-style: none; }
[data-hide-scrollbar]::-webkit-scrollbar, .scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }

/* ---------- shell ---------- */
#xmb {
  position: fixed; inset: 0; overflow: hidden; touch-action: none;
  background: radial-gradient(120% 90% at 50% 30%, var(--a16) 0%, #060a12 45%, #03050a 100%);
}
#bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.dim {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: rgba(3, 6, 12, 0.35); opacity: 0; transition: opacity 0.4s ease;
}
.is-open .dim { opacity: 1; }

.name {
  font-size: var(--fs-ui); font-weight: 400; letter-spacing: 0.34em; padding-left: 0.34em;
  text-transform: uppercase; color: var(--text-90); white-space: nowrap;
}
.statusbar {
  position: absolute; left: 0; right: 0; top: calc(26 * var(--u) + env(safe-area-inset-top, 0px));
  z-index: 5; display: flex; justify-content: center; pointer-events: none;
  transition: opacity 0.35s ease, transform 1s var(--ease);
}
.is-open .statusbar { opacity: 0; }

/* ---------- crossbar ---------- */
.xb {
  position: absolute; inset: 0; z-index: 6; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 80px, #000 calc(100% - 80px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 80px, #000 calc(100% - 80px), transparent 100%);
  transition: opacity 0.4s ease;
}
.xb-track { position: absolute; left: 0; top: 0; transition: transform 0.55s var(--ease); }
.xb-cat {
  position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; border: 0; background: none;
  cursor: pointer; pointer-events: auto; opacity: 0.45; --k: 1;
  transition: transform 0.55s var(--ease), opacity 0.42s ease;
}
.xb-cat::before { /* generous hit area that grows with the icon */
  content: ''; position: absolute; left: calc(var(--k) * -32 * var(--u)); top: calc(var(--k) * -32 * var(--u));
  width: calc(var(--k) * 64 * var(--u)); height: calc(var(--k) * 64 * var(--u)); border-radius: 50%;
}
.xb-cat::after { /* active-tab underline, shown on open pages */
  content: ''; position: absolute; left: calc(-12 * var(--u)); top: calc(var(--k) * 27 * var(--u) + 9 * var(--u));
  width: calc(24 * var(--u)); height: 3px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--a70);
  opacity: 0; transition: opacity 0.3s ease, top 0.42s var(--ease);
}
.is-open .xb-cat.on::after { opacity: 1; }
.xb-cat:hover { opacity: 0.75; }
.xb-cat.on { opacity: 1; }
.xb-glyph {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  width: calc(54 * var(--u) * var(--k)); height: calc(54 * var(--u) * var(--k));
  transition: width 0.42s var(--ease), height 0.42s var(--ease);
}
.xb-glyph svg { width: 100%; height: 100%; overflow: visible; }
.xb-glyph svg * { vector-effect: non-scaling-stroke; }
.xb-cat.on .xb-glyph { animation: iconPulse 2.6s ease-in-out infinite; }
.xb-label {
  position: absolute; left: 0; top: var(--label-top, 44px); transform: translateX(-50%);
  font-size: calc(18 * var(--u)); font-weight: 300; letter-spacing: 0.3em; padding-left: 0.3em;
  text-transform: uppercase; white-space: nowrap; opacity: 0; transition: opacity 0.3s ease;
  text-shadow: 0 0 16px var(--a70); pointer-events: none;
}
.xb-cat.on .xb-label { opacity: 1; }
.is-open .xb-label { opacity: 0 !important; }
.xb-tip { display: none; }

/* ---------- item lists ---------- */
.lists {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 3; pointer-events: none; overflow: hidden;
  -webkit-mask-image: var(--list-mask, none); mask-image: var(--list-mask, none);
}
.col { position: absolute; left: 0; top: 0; transition: opacity 0.32s ease, transform 0.5s var(--ease), visibility 0s linear 0s; }
.col.off { visibility: hidden; transition: opacity 0.32s ease, transform 0.5s var(--ease), visibility 0s linear 0.32s; }
.col.off .row { pointer-events: none; }
.row {
  position: absolute; left: 0; top: 0; width: max-content; min-height: calc(60 * var(--u));
  display: flex; align-items: center; gap: calc(16 * var(--u));
  padding: calc(8 * var(--u)) calc(20 * var(--u)) calc(8 * var(--u)) calc(8 * var(--u));
  border: 0; border-radius: calc(16 * var(--u)); background: transparent; text-align: left;
  white-space: nowrap; cursor: pointer; pointer-events: auto; opacity: 0.6;
  transform-origin: calc(30 * var(--u)) 50%;
  transition: transform 0.36s var(--ease), opacity 0.36s ease, background-color 0.3s ease, box-shadow 0.3s ease;
}
.row:hover { opacity: 0.85; }
.row.sel { opacity: 1; background: var(--a12); box-shadow: inset 0 0 0 1px var(--a30); }
.row.gone { opacity: 0 !important; pointer-events: none; }
.row-tile {
  width: calc(44 * var(--u)); height: calc(44 * var(--u)); flex: none; border-radius: calc(12 * var(--u));
  display: grid; place-items: center; color: rgba(255, 255, 255, 0.55);
  border: 1.5px solid rgba(255, 255, 255, 0.28);
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
  transition: border-color 0.3s, background 0.3s, color 0.3s, box-shadow 0.3s;
}
.row-tile svg { width: calc(22 * var(--u)); height: calc(22 * var(--u)); }
.row.sel .row-tile {
  color: #fff; border-color: var(--a90);
  background: linear-gradient(160deg, var(--a35), var(--a08));
  box-shadow: 0 0 20px var(--a70), inset 0 0 10px rgba(255, 255, 255, 0.2);
}
.row-text { display: grid; grid-template-rows: auto 0fr; min-width: 0; transition: grid-template-rows 0.36s var(--ease); }
.row-label {
  font-size: var(--fs-item); line-height: 1.3; letter-spacing: 0.04em;
  overflow: hidden; text-overflow: ellipsis; max-width: var(--label-max, none);
}
.row.sel .row-label { text-shadow: 0 0 16px var(--a70); }
.row-desc {
  display: none; overflow: hidden; min-height: 0; font-size: var(--fs-ui); letter-spacing: 0.05em; color: var(--muted);
  opacity: 0; transition: opacity 0.3s ease; text-overflow: ellipsis;
}
.row.sel.with-desc .row-text { grid-template-rows: auto 1fr; }
.row.sel.with-desc .row-desc { display: block; opacity: 1; }
.playing .lists, .playing .xb { opacity: 0.22; }

/* ---------- detail panel ---------- */
.panel {
  position: absolute; z-index: 7; left: var(--content-x); right: var(--panel-r);
  top: var(--panel-top); bottom: var(--panel-bottom);
  display: flex; flex-direction: column; opacity: 0; transform: translateX(24px); pointer-events: none;
  transition: opacity 0.4s ease, transform 0.45s var(--ease);
}
.is-open .panel { opacity: 1; transform: none; pointer-events: auto; }
.panel.enter .p-head, .panel.enter .p-body > * { animation: enter 0.38s var(--ease) both; }
.panel.enter .p-body > * { animation-delay: 0.04s; }
.p-head { flex: none; padding-bottom: calc(40 * var(--u)); }
:root:not(.mobile) .p-head { text-align: center; }
.is-open .row:not(.sel) { opacity: 0.72; }

/* mirrored right-hand column (wide screens only) */
.aside {
  position: absolute; z-index: 7; left: var(--aside-x); width: var(--aside-w);
  top: var(--panel-top); bottom: var(--panel-bottom);
  display: flex; flex-direction: column; align-items: center;
  opacity: 0; transform: translateX(24px); pointer-events: none;
  transition: opacity 0.4s ease, transform 0.45s var(--ease);
}
.wide .is-open .aside { opacity: 1; transform: none; pointer-events: auto; }
.aside.enter > * { animation: enter 0.42s var(--ease) 0.06s both; }
.hero, .detail { width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: calc(19 * var(--u)); }
.hero { gap: calc(22 * var(--u)); }
.hero-tile {
  width: min(86%, calc(184 * var(--u))); aspect-ratio: 1; border-radius: 26%;
  display: grid; place-items: center; color: rgba(255, 255, 255, 0.62);
  background: linear-gradient(160deg, var(--a08), rgba(255, 255, 255, 0.015) 70%);
  box-shadow: inset 0 0 0 1px var(--a22), inset 0 0 40px var(--a08), 0 0 60px var(--a08);
  animation: float 6s ease-in-out infinite;
}
.hero-tile svg { width: 44%; height: 44%; overflow: visible; filter: drop-shadow(0 0 12px var(--a55)); }
.hero-tile svg * { vector-effect: non-scaling-stroke; stroke-width: 1.6px; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.hero-cap { display: flex; flex-direction: column; align-items: center; gap: calc(6 * var(--u)); }
.hero-pos { font-size: var(--fs-ui); letter-spacing: 0.08em; color: var(--muted); font-variant-numeric: tabular-nums; }
.detail { gap: calc(14 * var(--u)); text-align: center; }
.detail-art {
  position: relative; width: min(100%, calc(230 * var(--u))); aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden;
  container-type: inline-size; background: rgba(255, 255, 255, 0.05);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6), 0 0 44px var(--a22), inset 0 0 0 1px rgba(255, 255, 255, 0.14);
}
.detail-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.35s ease; }
.detail-art img.ok { opacity: 1; }
.detail-title { font-size: var(--fs-item); line-height: 1.25; letter-spacing: 0.03em; max-width: 100%; text-shadow: 0 0 20px var(--a35); }
.detail-sub { font-size: var(--fs-label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
.p-chips { display: none; }
.eyebrow, .ctl-label, .flow h3, .c-label {
  font-size: var(--fs-label); font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase;
}
.eyebrow { color: var(--a-ink); }
.p-title {
  margin: calc(8 * var(--u)) 0 0; font-size: var(--fs-title); font-weight: 300; line-height: 1.2;
  letter-spacing: 0.03em; text-shadow: 0 0 30px var(--a35);
}
.p-desc { margin-top: calc(8 * var(--u)); font-size: var(--fs-ui); letter-spacing: 0.04em; color: var(--muted); line-height: 1.5; }
.p-body { position: relative; flex: 1; min-height: 0; }
.scroll { height: 100%; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.scroll.more { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 32px), transparent); }

/* focus ring: only while the panel itself has keyboard focus */
.zone-panel .f { outline: 2px solid var(--a90); outline-offset: 3px; }

/* text blocks */
.flow { max-width: calc(680 * var(--u)); margin: 0 auto; display: flex; flex-direction: column; gap: calc(18 * var(--u)); padding-bottom: calc(32 * var(--u)); }
:root:not(.mobile) .flow.short { text-align: center; }
.flow h3 { margin: calc(18 * var(--u)) 0 calc(-4 * var(--u)); color: var(--a-ink); }
.flow h3:first-child { margin-top: 0; }
.flow p { margin: 0; font-size: var(--fs-body); line-height: 1.6; letter-spacing: 0.01em; color: var(--text-90); text-wrap: pretty; }
.flow ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: calc(12 * var(--u)); }
.flow li { position: relative; padding-left: calc(22 * var(--u)); font-size: var(--fs-body); line-height: 1.6; color: var(--text-90); text-wrap: pretty; }
.flow li::before {
  content: ''; position: absolute; left: 0; top: calc(0.8em - 3.5px); width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--a55);
}

/* placeholders */
.ph {
  max-width: calc(680 * var(--u)); margin: 0 auto; min-height: calc(200 * var(--u)); padding: calc(32 * var(--u));
  border: 1px dashed rgba(255, 255, 255, 0.18); border-radius: calc(16 * var(--u));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(10 * var(--u)); text-align: center;
}
.ph code { font-family: var(--mono); font-size: var(--fs-ui); color: rgba(190, 212, 240, 0.6); letter-spacing: 0.04em; }
.ph small { font-size: var(--fs-label); letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); }

/* cover grids */
.covers {
  display: grid; grid-template-columns: repeat(var(--cols, 8), minmax(0, 1fr)); align-content: start;
  gap: calc(26 * var(--u)) calc(18 * var(--u)); padding: 6px 6px calc(32 * var(--u));
}
.cover { display: flex; flex-direction: column; gap: calc(8 * var(--u)); padding: 0; border: 0; background: none; text-align: center; cursor: pointer; border-radius: 6px; }
.zone-panel .cover.f { outline: none; }
.cover-art {
  position: relative; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden; background: rgba(255, 255, 255, 0.05); container-type: inline-size;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.12);
  transition: transform 0.25s var(--ease), box-shadow 0.25s ease;
}
.cover:hover .cover-art { transform: translateY(-2px); }
.zone-panel .cover.f .cover-art { outline: 2px solid var(--a90); outline-offset: 3px; transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 26px rgba(0, 0, 0, 0.6), 0 0 24px var(--a35); }
.cover-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.45s ease; }
.cover-art img.ok { opacity: 1; }
.poster {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
  padding: 12% 11%; text-align: left; overflow: hidden;
  background:
    radial-gradient(120% 70% at var(--px, 30%) var(--py, 20%), color-mix(in srgb, var(--accent) var(--pa, 30%), transparent), transparent 70%),
    linear-gradient(var(--pd, 165deg), rgba(255, 255, 255, 0.06), rgba(0, 0, 0, 0.35));
}
.poster::before {
  content: ''; position: absolute; left: 11%; right: 11%; top: 11%; height: 1px; background: rgba(255, 255, 255, 0.25);
}
.poster b { font-weight: 400; font-size: clamp(8px, 10cqw, 15px); line-height: 1.15; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255, 255, 255, 0.88); -webkit-hyphens: auto; hyphens: auto; overflow-wrap: anywhere; }
.poster i { font-style: normal; font-size: clamp(7px, 7cqw, 10px); letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255, 255, 255, 0.45); }
.cover-title { font-size: var(--fs-label); letter-spacing: 0.02em; line-height: 1.3; color: rgba(238, 243, 250, 0.8); }

/* settings */
.stack { display: flex; flex-direction: column; gap: calc(34 * var(--u)); width: 100%; max-width: calc(680 * var(--u)); margin: 0 auto; padding-bottom: calc(24 * var(--u)); }
.ctl-label { color: var(--faint); margin-bottom: calc(14 * var(--u)); }
:root:not(.mobile) .stack .ctl-label, :root:not(.mobile) .note { text-align: center; }
:root:not(.mobile) .stack > .pills { justify-content: center; }
.swatches { display: grid; justify-content: center; grid-template-columns: repeat(14, minmax(0, calc(34 * var(--u)))); gap: calc(6 * var(--u)); }
.sw {
  width: 100%; height: auto; aspect-ratio: 1; padding: 0; border-radius: 5px; cursor: pointer;
  border: 2px solid rgba(255, 255, 255, 0.15); transition: transform 0.15s ease;
}
.sw:hover { transform: scale(1.12); }
.sw.cur { border-color: rgba(255, 255, 255, 0.95); box-shadow: 0 0 12px var(--a70); }
.zone-panel .sw.f { outline-offset: 1px; }
.setlist { width: 100%; max-width: calc(680 * var(--u)); margin: 0 auto; border-top: 1px solid var(--line); }
.setrow {
  width: 100%; min-height: calc(76 * var(--u)); display: flex; align-items: center; justify-content: space-between;
  gap: calc(24 * var(--u)); padding: calc(12 * var(--u)) calc(20 * var(--u)); border: 0; border-bottom: 1px solid var(--line);
  background: none; text-align: left; border-radius: 0;
}
button.setrow { cursor: pointer; }
button.setrow:hover { background: rgba(255, 255, 255, 0.03); }
.zone-panel .setrow.f { outline-offset: -2px; border-radius: calc(12 * var(--u)); background: var(--a08); }
.setrow-text { display: flex; flex-direction: column; gap: calc(4 * var(--u)); }
.setrow-name { font-size: var(--fs-body); letter-spacing: 0.05em; color: var(--text-90); }
.setrow-sub { font-size: calc(13 * var(--u)); letter-spacing: 0.05em; color: var(--faint); }
.pills { display: flex; flex-wrap: wrap; gap: calc(10 * var(--u)); }
.pill {
  height: calc(44 * var(--u)); padding: 0 calc(22 * var(--u)); border-radius: calc(22 * var(--u));
  display: inline-flex; align-items: center; gap: calc(10 * var(--u)); white-space: nowrap;
  border: 1px solid rgba(255, 255, 255, 0.24); background: transparent; cursor: pointer;
  font-size: calc(16 * var(--u)); letter-spacing: 0.07em; transition: background 0.2s ease, border-color 0.2s ease;
}
.pill:hover { border-color: rgba(255, 255, 255, 0.45); }
.pill.on, .pill.primary { background: var(--a22); border-color: var(--a70); }
.pill.primary { height: calc(48 * var(--u)); padding: 0 calc(30 * var(--u)); border-radius: calc(24 * var(--u)); color: #fff; }
.pill svg { width: calc(16 * var(--u)); height: calc(16 * var(--u)); }
.track {
  position: relative; flex: none; width: calc(58 * var(--u)); height: calc(32 * var(--u)); border-radius: calc(16 * var(--u));
  border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.08); transition: background 0.3s ease;
}
.knob {
  position: absolute; top: 2px; left: 2px; width: calc(26 * var(--u)); height: calc(26 * var(--u)); border-radius: 50%;
  background: #fff; transition: transform 0.25s var(--ease);
}
.on > .track { background: var(--a55); }
.on > .track .knob { transform: translateX(calc(26 * var(--u))); }
.fx-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: calc(16 * var(--u)); width: 100%; }
.fx {
  display: flex; flex-direction: column; gap: calc(8 * var(--u)); padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
  border-radius: calc(10 * var(--u));
}

/* =====================================================================
   ICONS
   Category glyphs share a 48 grid: every outline is centred on (24,24),
   spans roughly 32–37 units and is drawn with the same 2px stroke
   (non-scaling, so the weight never changes with size).
   ===================================================================== */

function gearPath(cx, cy, ro, ri, n) {
  const step = (Math.PI * 2) / n, top = step * 0.19, base = step * 0.29;
  const pt = (a, r) => (cx + Math.cos(a) * r).toFixed(2) + ' ' + (cy + Math.sin(a) * r).toFixed(2);
  let d = '';
  for (let i = 0; i < n; i++) {
    const a = i * step - Math.PI / 2;
    d += (i ? 'L' : 'M') + pt(a - base, ri) + 'L' + pt(a - top, ro) + 'L' + pt(a + top, ro) + 'L' + pt(a + base, ri);
    d += 'A' + ri + ' ' + ri + ' 0 0 1 ' + pt((i + 1) * step - Math.PI / 2 - base, ri);
  }
  return d + 'Z';
}

/* ---------- colour ---------- */
function hexToRgb(hex) {
  const h = String(hex || '#7ab8ff').replace('#', '');
  return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
}
function rgbToHex(c) { return '#' + [c.r, c.g, c.b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); }
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = (n) => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return rgbToHex({ r: 255 * f(0), g: 255 * f(8), b: 255 * f(4) });
}
// 14 × 6 grid: hue = (150 − c·360/14) mod 360, lightness = 86 − 11r, saturation = 58 + 5r
const THEME_COLS = 14;
const THEMES = (() => {
  const out = [];
  for (let r = 0; r < 6; r++) for (let c = 0; c < THEME_COLS; c++) out.push(hslToHex((150 - c * (360 / THEME_COLS) + 360) % 360, 58 + r * 5, 86 - r * 11));
  return out;
})();

/* ---------- sound (WebAudio sine blips) ---------- */
const audio = { ctx: null, out: null };
function audioCtx() {
  if (!audio.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { audio.ctx = new AC(); audio.out = audio.ctx.createGain(); audio.out.connect(audio.ctx.destination); } catch (e) { return null; }
  }
  if (audio.ctx.state === 'suspended') audio.ctx.resume().catch(() => {});
  return audio.ctx;
}
const VOLS = [0, 0.45, 1, 1.7];
function blip(f1, dur, vol, f2, type, delay) {
  if (settings.muted) return;
  const c = audioCtx();
  if (!c) return;
  try {
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol * VOLS[settings.volume]), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audio.out);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) { /* audio unavailable */ }
}

  bump: () => blip(260, 0.07, 0.045, 200),
  toggle: () => blip(1040, 0.06, 0.055, 1400),
  score: () => blip(990, 0.07, 0.05, 1480),
  hit: () => blip(560, 0.035, 0.045),

/* ---------- embedded files ---------- */
function b64ToBytes(b64) {
  const bin = atob(String(b64).replace(/\s+/g, ''));
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function loadFonts() {
  const faces = [
    ['Jost', 'asset-font-jost', { weight: '100 900', style: 'normal' }],
    ['Noto Sans Tamil', 'asset-font-tamil', { weight: '100 900', style: 'normal', unicodeRange: 'U+0964-0965, U+0B82-0BFA, U+200C-200D, U+20B9, U+25CC' }],
  ];
  const jobs = [];
  for (const [family, id, desc] of faces) {
    const node = document.getElementById(id);
    if (!node || node.textContent.trim().length < 100) continue;
    try {
      const ff = new FontFace(family, b64ToBytes(node.textContent).buffer, desc);
      document.fonts.add(ff);
      jobs.push(ff.load());
    } catch (e) { /* fall back to system fonts */ }
  }
  return Promise.all(jobs).catch(() => {});
}
let pdfUrl = null;
function resumeUrl() {
  if (pdfUrl) return pdfUrl;
  const node = document.getElementById('asset-resume');
  if (node && node.textContent.trim().length > 100) {
    try { pdfUrl = URL.createObjectURL(new Blob([b64ToBytes(node.textContent)], { type: 'application/pdf' })); return pdfUrl; } catch (e) { /* use the file */ }
  }
  return SITE.resumeFile;
}
function downloadResume() {
  const a = document.createElement('a');
  a.href = resumeUrl(); a.download = SITE.resumeFile; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Résumé saved to downloads', 'Download', svg24(UI_ICONS.download));
  award('resume');
}
function openResume() {
  const w = window.open(resumeUrl(), '_blank');
  if (w) { try { w.opener = null; } catch (e) { /* cross-origin */ } }
  award('resume');
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;left:0;top:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

/* =====================================================================
   LAYOUT: one set of metrics drives every position.
   Home: the selected item's tile sits on the same vertical axis as the
   focused category icon, and that axis sits just left of centre so the
   icon + list read as one centred group.
   Open (wide screens): a mirrored three-column stage. Item list on the
   left, content centred on the screen, a matching column on the right
   (hero tile, game info or cover detail). Equal outer margins, equal
   gutters, crossbar centred over the content.
   ===================================================================== */
const L = {};
let catEls = [], colEls = [], rowEls = [];
const OPEN_SEL = 0.8, OPEN_UN = 0.75, OPEN_GAP = 14;

const itemDesc = (it) => (it.type === 'trophies' ? trophyCount() + ' of ' + TROPHIES.length + ' earned' : it.desc);

function buildXMB() {
  $('#xb-track').innerHTML = CATS.map((c, i) =>
    '<button class="xb-cat" data-i="' + i + '" tabindex="-1" aria-label="' + esc(c.name) + '" title="' + esc(c.name) + '">' +

    '<span class="row-tile">' + svg24(ITEM_ICONS[it.id] || ITEM_ICONS.view) + '</span>' +
    '<span class="row-text"><span class="row-label">' + esc(it.label) + '</span><span class="row-desc">' + esc(itemDesc(it)) + '</span></span>' +
    '</button>').join('') + '</div>').join('');
  colEls = $$('.col');
  rowEls = colEls.map((col) => $$('.row', col));
  $('#bb-hints').innerHTML =
    '<span class="hint" data-act="nav" aria-hidden="true"><span class="badge sq">' + svg24(UI_ICONS.dpad) + '</span><span class="hint-text" id="h-nav">Navigate</span></span>' +
    '<button class="hint" data-act="enter" tabindex="-1"><span class="badge">' + svg24(UI_ICONS.cross) + '</span><span class="hint-text" id="h-enter">Enter</span></button>' +
    '<button class="hint" data-act="back" tabindex="-1"><span class="badge">' + svg24(UI_ICONS.circle) + '</span><span class="hint-text" id="h-back">Back</span></button>';
}

function refreshDescs() {
  CATS.forEach((c, i) => c.items.forEach((it, j) => {
    const d = $('.row-desc', rowEls[i][j]);
    if (d) d.textContent = itemDesc(it);
  }));
}

// widest label overall (sizes the sidebar) and, per category, the widest label-or-description
// (sizes the list block that sits centred under its icon on the home screen)
function measureRows() {
  const box = document.createElement('div');
  box.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap';
  box.innerHTML = '<span class="row-label" style="display:block;max-width:none"></span><span class="row-desc" style="display:block;max-width:none"></span>';
  $('#xmb').appendChild(box);
  const lab = box.firstChild, desc = box.lastChild;
  let maxLabel = 0;
  const colText = CATS.map((c) => c.items.reduce((w, it) => {
    lab.textContent = it.label; desc.textContent = itemDesc(it);
    const lw = lab.getBoundingClientRect().width;
    maxLabel = Math.max(maxLabel, lw);
    return Math.max(w, lw, desc.getBoundingClientRect().width);
  }, 0));
  box.remove();
  return { maxLabel: Math.ceil(maxLabel), colText };
}

function computeLayout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const mobile = vw < 760;
  const s = mobile ? 1 : (vh < 620 ? Math.max(0.72, vh / 620) : clamp(Math.min(vw / 1440, vh / 900), 1, 1.5));
  const wasWide = L.wide;
  Object.assign(L, { vw, vh, s, mobile });
  root.style.setProperty('--s', s.toFixed(4));
  root.classList.toggle('mobile', mobile);

  // Home crossbar (classic XMB): the focused icon always sits on one fixed axis and the bar slides
  // under it, so the item list below never moves sideways. The axis is chosen so that with the
  // start category (About) focused, the whole bar is exactly centred on the screen.
  const span = CATS.length - 1;
  const fitPitch = Math.min(150 * s, (vw / 2 - 120 * s) / (span / 2));
  L.staticBar = !mobile && fitPitch >= 112 * s;   // all 8 icons fit, so the start state can be centred
  if (mobile) {
    L.axisX = Math.round(clamp(vw * 0.2, 60, 96));
    L.barY = Math.round(clamp(vh * 0.2, 118, 176));
    L.pitch = 96; L.kOn = 1.45; L.kOff = 0.95; L.labelLine = 18;
  } else {
    L.barY = Math.round(Math.max(160 * s, vh * 0.31));
    L.labelLine = 22 * s;
    if (L.staticBar) {
      L.pitch = fitPitch;
      const k = clamp(fitPitch / (150 * s), 0.75, 1);  // icons shrink a little only if the bar is squeezed
      L.kOn = 1.75 * k; L.kOff = 1.22 * k;
      L.axisX = vw / 2 + (START_CAT - span / 2) * L.pitch; // where About sits when the bar is centred
    } else {
      L.axisX = Math.round(clamp(vw / 2 - 160 * s, vw * 0.29, vw * 0.42));
      L.pitch = 130 * s; L.kOn = 1.75; L.kOff = 1.22;
    }
  }
  const glyphHalf = (54 * s * L.kOn * 0.75) / 2;     // ink spans ~3/4 of the glyph box
  L.labelTop = Math.round(glyphHalf + 14 * s);
  L.selY = L.barY + L.labelTop + L.labelLine + (18 + 33) * s; // label line, gap, half the selected row
  L.prevY = L.barY - glyphHalf - (18 + 24) * s;               // first row above the crossbar

  const m = measureRows();
  L.labelW = m.maxLabel;
  L.colW = m.colText.map((t) => (8 + 44 + 16 + 20) * s + t); // tile pad + tile + gap + text + end pad
  if (mobile) {
    L.wide = false;
    L.sbX = 20; L.sbW = 0; L.contentX = 20; L.panelR = 20;
    L.panelTop = 78; L.panelBottom = 62;
    L.barYOpen = 38; L.pitchOpen = (vw - 60) / (CATS.length - 1); L.openX0 = 30;
  } else {
    const G = Math.round(48 * s);
    L.sbX = Math.round(clamp(vw * 0.03, 24, 60 * s));
    L.sbW = Math.round(((8 + 44 + 16 + 20) * s + L.labelW) * OPEN_SEL);
    const mainW = vw - 2 * (L.sbX + L.sbW + G);
    L.wide = mainW >= 520 * s;
    if (L.wide) {
      L.contentX = L.sbX + L.sbW + G;          // mirrored: the right inset equals the left inset
      L.panelR = L.contentX;
      L.asideX = vw - L.sbX - L.sbW; L.asideW = L.sbW;
    } else {
      L.contentX = Math.round(Math.min(vw * 0.42, L.sbX + L.sbW + G));
      L.panelR = L.sbX;
    }
    L.barYOpen = Math.round(vh * 0.04 + 30 * s);
    L.panelTop = Math.round(Math.max(vh * 0.16, L.barYOpen + 58 * s)); // room for the bigger bar + its underline
    L.panelBottom = Math.round(vh * 0.13);
    L.pitchOpen = Math.min(76 * s, (vw - 120) / 7.5);
    const mainMid = (L.contentX + vw - L.panelR) / 2, span = (CATS.length - 1) * L.pitchOpen;
    L.openX0 = clamp(mainMid - span / 2, 40 * s, vw - 40 * s - span); // centred, but never off-screen
  }
  root.classList.toggle('wide', L.wide);
  L.titleY = L.panelTop + (12 * 1.4 + 8 + (34 * 1.2) / 2) * s;
  L.labelMax = Math.max(80, (L.contentX - 48 * s - L.sbX) / OPEN_SEL - 88 * s);
  root.style.setProperty('--content-x', L.contentX + 'px');
  root.style.setProperty('--panel-top', L.panelTop + 'px');
  root.style.setProperty('--panel-bottom', L.panelBottom + 'px');
  root.style.setProperty('--panel-r', L.panelR + 'px');
  root.style.setProperty('--aside-x', (L.asideX || 0) + 'px');
  root.style.setProperty('--aside-w', (L.asideW || 0) + 'px');
  $('#xb').style.setProperty('--label-top', L.labelTop + 'px');
  return wasWide !== undefined && wasWide !== L.wide;   // tier changed → panels need a re-render
}

function place() {
  const xmb = $('#xmb'), open = state.open, s = L.s;
  xmb.classList.toggle('is-open', open);
  xmb.classList.toggle('zone-panel', open && state.zone === 'panel');
  xmb.classList.toggle('playing', !!state.game);

  const trackX = open ? L.openX0 : L.axisX - state.cat * L.pitch;
  $('#xb-track').style.transform = 'translate(' + trackX.toFixed(1) + 'px,' + (open ? L.barYOpen : L.barY) + 'px)';
  catEls.forEach((el, i) => {
    const on = i === state.cat;
    el.classList.toggle('on', on);
    el.style.transform = 'translateX(' + (i * (open ? L.pitchOpen : L.pitch)).toFixed(1) + 'px)';
    el.style.setProperty('--k', open ? (L.mobile ? (on ? 0.7 : 0.56) : (on ? 0.95 : 0.76)) : (on ? L.kOn : L.kOff));
    el.setAttribute('aria-current', on ? 'true' : 'false');
  });

  const lists = $('#lists');
  const fadeTop = open ? L.barYOpen + 40 * s : 52 * s;
  const fadeBot = open ? Math.max(40 * s, L.panelBottom - 20 * s) : 62 * s;
  lists.style.setProperty('--list-mask', 'linear-gradient(180deg, transparent 0, transparent ' + fadeTop + 'px, #000 ' + (fadeTop + 36 * s) +
    'px, #000 calc(100% - ' + (fadeBot + 26 * s) + 'px), transparent calc(100% - ' + fadeBot + 'px))');
  lists.style.setProperty('--label-max', open && !L.mobile ? L.labelMax + 'px' : 'none');
  colEls.forEach((col, i) => {
    const active = i === state.cat;
    const off = active ? 0 : (i < state.cat ? -46 : 46);
    // home: the item tiles line up under the fixed focus axis for every category
    const x = open ? L.sbX + 30 * s * OPEN_SEL - 30 * s : L.axisX - 30 * s;
    col.style.transform = 'translateX(' + (x + off).toFixed(1) + 'px)';
    const shown = active && !(open && L.mobile);
    col.style.opacity = shown ? 1 : 0;
    col.classList.toggle('off', !shown);
    placeRows(i);
  });
  renderHints();
}

function placeRows(i) {
  const s = L.s, open = state.open, sel = state.sel[i];
  const topLimit = open ? L.barYOpen + 44 * s : 70 * s;
  const botLimit = L.vh - (open ? Math.max(48 * s, L.panelBottom - 12 * s) : 84 * s);
  const first = (30 * OPEN_SEL + OPEN_GAP + 30 * OPEN_UN) * s, pitch = (60 * OPEN_UN + OPEN_GAP) * s;
  rowEls[i].forEach((row, j) => {
    const d = j - sel;
    let y, k;
    if (open) {
      k = d === 0 ? OPEN_SEL : OPEN_UN;
      y = d === 0 ? L.titleY : d > 0 ? L.titleY + first + (d - 1) * pitch : L.titleY - first + (d + 1) * pitch;
    } else {
      k = d === 0 ? 1 : 0.8;
      y = d === 0 ? L.selY : d > 0 ? L.selY + 73 * s + (d - 1) * 64 * s : L.prevY + (d + 1) * 64 * s;
    }
    row.style.transform = 'translate(0px,' + y.toFixed(1) + 'px) translateY(-50%) scale(' + k.toFixed(3) + ')';
    row.classList.toggle('sel', d === 0);
    row.classList.toggle('with-desc', d === 0 && !open);
    row.classList.toggle('gone', d !== 0 && (y < topLimit || y > botLimit));
    row.setAttribute('aria-current', d === 0 ? 'true' : 'false');
  });
}

function renderHints() {
  const it = curItem();
  let nav = 'Navigate', enter = 'Open', back = 'Back', enterOn = true, backOn = state.open;
  if (state.game && GH.def) {
    nav = GH.def.keys[0][1];
    const g = GH.game;
    if (!g || !g.playing) enter = 'Restart';
    else if (GH.id === 'ttt') enter = 'Place';
    else if (GH.id === 'flappy') enter = 'Flap';
    else { enter = 'Restart'; enterOn = false; } // nothing to press mid-game
    back = 'Quit'; backOn = true;
  } else if (state.open) {
    if (state.zone === 'panel') { nav = 'Move'; enter = 'Select'; }
    else if (it.type === 'game') enter = 'Play';
    else if (state.focusables.length) enter = 'Select';
    else enterOn = false;
  }
  $('#h-nav').textContent = nav;
  $('#h-enter').textContent = enter;
  $('#h-back').textContent = back;
  $('.hint[data-act=enter]').disabled = !enterOn;
  $('.hint[data-act=back]').disabled = !backOn;
}

/* =====================================================================
   PANELS: one renderer per item type. Anything the keyboard can reach
   inside a panel carries [data-f]; arrows move between them spatially.
   ===================================================================== */
const PANEL = { key: '', type: '', cleanup: [] };

function renderPanel() {
  const cat = curCat(), it = curItem();
  PANEL.cleanup.forEach((fn) => { try { fn(); } catch (e) { /* already gone */ } });
  PANEL.cleanup = [];
  PANEL.key = cat.id + '/' + it.id;
  PANEL.type = it.type;
  const head = $('#p-head'), body = $('#p-body');
  const chips = '<div class="p-chips">' + cat.items.map((x, j) =>
    '<button class="pill' + (j === state.sel[state.cat] ? ' on' : '') + '" data-chip="' + j + '" tabindex="-1">' + esc(x.label) + '</button>').join('') + '</div>';
  if (it.type === 'contact') {
    head.innerHTML = chips;
    head.style.paddingBottom = '0px';
  } else {
    const desc = itemDesc(it);
    head.innerHTML = chips + '<div class="eyebrow">' + esc(cat.name) + '</div><h1 class="p-title">' + esc(it.label) + '</h1>' +
      (desc ? '<div class="p-desc">' + esc(desc) + '</div>' : '');
    head.style.paddingBottom = '';
  }
  body.innerHTML = '';
  $('#aside').innerHTML = '';
  (RENDER[it.type] || RENDER.placeholder)(body, it, cat);
  state.focusables = $$('[data-f]', body);
  state.focus = clamp(PANEL.initialFocus || 0, 0, Math.max(0, state.focusables.length - 1));
  PANEL.initialFocus = 0;
  if (!state.focusables.length && state.zone === 'panel') state.zone = 'list';
  renderAside();
  const panel = $('#panel'), aside = $('#aside');
  [panel, aside].forEach((n) => { n.classList.remove('enter'); void n.offsetWidth; n.classList.add('enter'); });
  // the chip row only gets layout once the panel is open, so scroll it on the next frame
  requestAnimationFrame(() => {
    const chipRow = $('.p-chips', head), chipOn = chipRow && $('.pill.on', chipRow);
    if (chipOn) chipRow.scrollLeft += chipOn.getBoundingClientRect().left - chipRow.getBoundingClientRect().left - 20;
  });
  updateFocus(false);
}

function updateFocus(scroll) {
  state.focusables.forEach((el, i) => el.classList.toggle('f', i === state.focus));
  const el = state.focusables[state.focus];
  if (el && scroll !== false && state.zone === 'panel') keepVisible(el);
  if (PANEL.type === 'covers') renderCoverDetail();
  $('#xmb').classList.toggle('zone-panel', state.open && state.zone === 'panel');
  renderHints();
}

function keepVisible(el) {
  const sc = el.closest('.scroll');
  if (!sc) return;
  const r = el.getBoundingClientRect(), b = sc.getBoundingClientRect(), pad = 16;
  if (r.top < b.top + pad) sc.scrollTop -= b.top + pad - r.top;
  else if (r.bottom > b.bottom - pad) sc.scrollTop += r.bottom - (b.bottom - pad);
}

function bindScroll(sc) {
  if (!sc) return;
  const upd = () => sc.classList.toggle('more', sc.scrollHeight - sc.clientHeight - sc.scrollTop > 2);
  sc.addEventListener('scroll', upd, { passive: true });
  upd(); requestAnimationFrame(upd);
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(upd);
    ro.observe(sc); if (sc.firstElementChild) ro.observe(sc.firstElementChild);
    PANEL.cleanup.push(() => ro.disconnect());
  }
}

const posterCache = store.get('xmb.posters.v1', {});
const posterBusy = {};
function loadPoster(page) {
  if (posterCache[page]) return Promise.resolve(posterCache[page]);
  if (posterBusy[page]) return posterBusy[page];
  return (posterBusy[page] = fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(page.replace(/ /g, '_')))
    .then((r) => (r.ok ? r.json() : null))
    .then((j) => {
      const url = j && j.thumbnail && j.thumbnail.source;
      if (url && j.thumbnail.height > j.thumbnail.width) { posterCache[page] = url; store.set('xmb.posters.v1', posterCache); return url; }
      return null;
    })
    .catch(() => null)
    .then((u) => { delete posterBusy[page]; return u; }));
}

function poster(title, kind) {
  let h = 7;
  for (const ch of title) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return '<span class="poster" style="--px:' + (18 + (h % 64)) + '%;--py:' + (8 + ((h >>> 6) % 50)) + '%;--pa:' + (18 + ((h >>> 12) % 26)) +
    '%;--pd:' + (140 + ((h >>> 18) % 70)) + 'deg"><i>' + kind + '</i><b>' + esc(title) + '</b></span>';
}

}

/* ---------- panel actions ---------- */
function setToggle(el, on) { el.classList.toggle('on', on); el.setAttribute('aria-checked', String(on)); }
function setPills(el, attr) { $$('.pill[data-act="' + attr + '"]', el.closest('.setrow') || document).forEach((p) => p.classList.toggle('on', p === el)); }
function confirmThen(el, fn) {
  if (el.dataset.armed) { delete el.dataset.armed; fn(); return; }
  el.dataset.armed = '1';
  const old = el.textContent;
  el.textContent = 'Press again to confirm';
  setTimeout(() => { if (el.isConnected && el.dataset.armed) { delete el.dataset.armed; el.textContent = old; } }, 3000);
}
function setAccent(c) {
  settings.accent = c; saveSettings(); applyAccent(c);
  $$('.sw').forEach((s) => s.classList.toggle('cur', s.dataset.color === c));
  const hex = $('#acc-hex'); if (hex) hex.textContent = c.toUpperCase();
  if (c.toLowerCase() !== DEFAULTS.accent) award('designer');
}
function setBg(id) {
  settings.bg = id; saveSettings();
  $$('.fx').forEach((f) => f.classList.toggle('on', f.dataset.bg === id));
  if (id !== 'off') { state.bgTried.add(id); store.set('xmb.bgTried', Array.from(state.bgTried)); }
  if (state.bgTried.size >= 5) award('scenery');
  resetFx();
}

function activate(el) {
  if (!el) return;
  if (el.classList.contains('sw')) { setAccent(el.dataset.color); sfx.confirm(); return; }
  if (el.classList.contains('cover')) {
    if (el.dataset.appid) window.open('https://store.steampowered.com/app/' + el.dataset.appid + '/', '_blank', 'noopener');
    sfx.confirm(); return;
  }
  const act = el.dataset.act;
  switch (act) {
    case 'accent-reset': setAccent(DEFAULTS.accent); sfx.confirm(); break;
    case 'sound': settings.muted = !settings.muted; saveSettings(); setToggle(el, !settings.muted); sfx.toggle(); break;
    case 'vol': settings.volume = +el.dataset.v; saveSettings(); setPills(el, 'vol'); sfx.confirm(); break;
    case 'test-sound':
      if (settings.muted) toast('Sound is off', 'Turn UI sounds on to hear it', svg24(ITEM_ICONS.sound)); else sfx.confirm();
      break;
    case 'fmt': settings.clock = el.dataset.v; saveSettings(); setPills(el, 'fmt'); tickClock(); sfx.confirm(); break;
    case 'seconds': settings.seconds = !settings.seconds; saveSettings(); setToggle(el, settings.seconds); tickClock(); sfx.toggle(); break;
    case 'date': settings.date = !settings.date; saveSettings(); setToggle(el, settings.date); tickClock(); sfx.toggle(); break;
    case 'bg': setBg(el.dataset.bg); sfx.confirm(); break;
    case 'intro': settings.intro = !settings.intro; saveSettings(); setToggle(el, settings.intro); sfx.toggle(); break;
    case 'toasts': settings.toasts = !settings.toasts; saveSettings(); setToggle(el, settings.toasts); sfx.toggle(); break;
    case 'reset-settings': confirmThen(el, () => {
      Object.assign(settings, DEFAULTS); saveSettings(); applyAccent(settings.accent); resetFx(); tickClock();
      renderPanel(); toast('Settings restored to defaults', 'System', svg24(ITEM_ICONS.system)); sfx.confirm();
    }); break;
    case 'reset-trophies': confirmThen(el, () => {
      earned = {}; store.del(TROPHY_KEY); state.visited.clear(); store.del('xmb.visited');
      state.bgTried.clear(); store.del('xmb.bgTried'); onTrophiesChanged();
      toast('Trophies cleared', 'System', svg24(ITEM_ICONS.trophies)); sfx.back();
    }); break;
    case 'link': {
      const href = el.dataset.href;
      if (/^mailto:/.test(href)) award('hi');
      if (/^(mailto|tel):/.test(href)) location.href = href; else window.open(href, '_blank', 'noopener');
      sfx.confirm(); break;
    }
    case 'copy': {
      const text = el.dataset.copy;
      copyText(text).then((ok) => toast(ok ? 'Copied to clipboard' : 'Could not copy', text, svg24(UI_ICONS.copy)));
      if (text.includes('@') && text.includes('.')) award('hi');
      sfx.confirm(); break;
    }
    case 'pdf-download': downloadResume(); sfx.confirm(); break;
    case 'pdf-open': openResume(); sfx.confirm(); break;
    default: break;
  }
}

/* =====================================================================
   NAVIGATION
   Home: ←/→ categories, ↑/↓ items, Enter opens.
   Open: the sidebar ("list" zone) or the panel ("panel" zone) owns the
   arrows. Enter or → moves into a panel that has controls; ← at its left
   edge comes back out. Esc / Backspace / O always returns home.
   ===================================================================== */
function markVisited() {
  state.visited.add(curCat().id);
  store.set('xmb.visited', Array.from(state.visited));
  if (CATS.every((c) => state.visited.has(c.id))) award('explorer');
}

function afterItemChange() { // the opened item changed while the panel is open
  stopGame(true);
  state.zone = 'list';
  renderPanel();
  place();
  syncHash(true);
  markVisited();
}

function moveCat(d, quiet) {
  const n = state.cat + d;
  if (n < 0 || n >= CATS.length) { if (!quiet) sfx.bump(); return false; }
  state.cat = n; sfx.tick();
  if (state.open) afterItemChange(); else place();
  return true;
}

function moveItem(d, quiet) {
  const c = state.cat, n = state.sel[c] + d;
  if (n < 0 || n >= CATS[c].items.length) { if (!quiet) sfx.bump(); return false; }
  state.sel[c] = n; sfx.tick();
  if (state.open) afterItemChange(); else place();
  return true;
}

function openPanel(opts) {
  if (state.open) return;
  state.open = true;
  if (!(opts && opts.silent)) sfx.confirm();
  state.zone = 'list';
  renderPanel();
  if (state.focusables.length) state.zone = 'panel';
  updateFocus(false);
  place();
  syncHash(!!(opts && opts.fromRoute));
  markVisited();
}

function closePanel(fromPop) {
  if (!state.open) return;
  stopGame(true);
  PANEL.cleanup.forEach((fn) => { try { fn(); } catch (e) { /* gone */ } });
  PANEL.cleanup = [];
  unmountGame();
  state.open = false; state.zone = 'list';
  sfx.back();
  place();
  if (!fromPop) unsyncHash();
}

function doEnter() {
  if (state.game) { gameAction(); return; }
  if (!state.open) { openPanel(); return; }
  if (state.zone === 'panel') { activate(state.focusables[state.focus]); return; }
  if (curItem().type === 'game') { startGame(); return; }
  if (state.focusables.length) { state.zone = 'panel'; sfx.tick(); updateFocus(); return; }
  sfx.bump();
}

function doBack() {
  if (state.game) { stopGame(); sfx.back(); return; }
  if (state.open) closePanel();
}

function enterPanelZone() {
  if (!state.focusables.length) return false;
  state.zone = 'panel'; sfx.tick(); updateFocus(); return true;
}

// geometric focus movement, so any panel layout (grids, rows, pills) just works
function moveFocus(dir) {
  const list = state.focusables, cur = list[state.focus];
  if (!cur) return false;
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = -1, bestScore = Infinity;
  list.forEach((el, i) => {
    if (i === state.focus) return;
    const b = el.getBoundingClientRect();
    if (!b.width && !b.height) return;
    const bx = b.left + b.width / 2, by = b.top + b.height / 2;
    let main, cross, overlap;
    if (dir === 'left' || dir === 'right') {
      overlap = b.top < a.bottom - 2 && b.bottom > a.top + 2;
      if (!overlap) return; // sideways moves stay on the same row
      main = dir === 'left' ? ax - bx : bx - ax; cross = Math.abs(by - ay);
    } else {
      overlap = b.left < a.right - 2 && b.right > a.left + 2;
      main = dir === 'up' ? ay - by : by - ay; cross = Math.abs(bx - ax);
    }
    if (main <= 2) return;
    const score = main + cross * (overlap ? 0.3 : 2) + (overlap ? 0 : 10000);
    if (score < bestScore) { bestScore = score; best = i; }
  });
  if (best < 0) return false;
  state.focus = best; sfx.tick(); updateFocus();
  return true;
}

function scrollBody(d) {
  if (PANEL.type !== 'text' && PANEL.type !== 'trophies') return false;

function G2048() {

}

function TicTacToe() {

  g.start = () => { fresh(); g.playing = true; };

    const wx = winner('X'), wo = winner('O');
    if (wx) { line = wx; msg = 'You win!'; g.score += 1; award('ttt'); sfx.score(); }

    if (m >= 0) return m;
    if (Math.random() > 0.5) { m = tryWin('X'); if (m >= 0) return m; }
    if (!bd[4] && Math.random() > 0.5) return 4;
    const corners = [0, 2, 6, 8].filter((i) => !bd[i]);
    if (corners.length && Math.random() > 0.5) return corners[Math.floor(Math.random() * corners.length)];

const GAMES = { snake: Snake, pong: Pong, breaker: Breaker, g2048: G2048, ttt: TicTacToe, flappy: Flappy };

/* ---------- host ---------- */
function mountGame(body, id) {
  unmountGame();

  GH.id = id; GH.def = def; GH.game = GAMES[id]();
  const info = '<div class="game-info"><div class="gi-scores"><div><div class="ctl-label">Score</div><div class="gi-big" id="g-score">0</div></div>' +
    '<div><div class="ctl-label">Best</div><div class="gi-big gi-dim" id="g-best">0</div></div></div>' +
    '<div class="gi-status" id="g-status"></div>' +
    '<div class="gi-controls"><div class="ctl-label">Controls</div><div class="keys">' +
    def.keys.map(([ks, label]) => '<div>' + ks.map(kbd).join('') + '<span>' + esc(label) + '</span></div>').join('') +
    '<div>' + kbd('Enter') + '<span>Play / restart</span></div><div>' + kbd('Esc') + '<span>Quit</span></div></div></div></div>';
  // wide screens: the board is centred and score/controls fill the mirrored right column
  body.innerHTML = '<div class="game' + (L.wide ? ' solo' : '') + '" style="--ar:' + def.W + '/' + def.H + ';--nw:' + Math.round(def.W * def.cap * L.s) + 'px"><div class="game-row">' +
    '<div class="board-col"><canvas class="board' + (def.pixel ? ' pixel' : '') + '" aria-label="' + esc(def.title) + ' board"></canvas><div class="board-hint" id="g-hint"></div></div>' +
    (L.wide ? '' : info) + '</div></div>';
  if (L.wide) $('#aside').innerHTML = info;
  GH.canvas = $('.board', body);
  GH.ctx = GH.canvas.getContext('2d');
  GH.game.prime();
  bindBoard(GH.canvas);
  if (window.ResizeObserver) { GH.ro = new ResizeObserver(() => gameResize()); GH.ro.observe(GH.canvas); }
  PANEL.cleanup.push(unmountGame);
  gameResize();
  updateGameHud();
}

function unmountGame() {
  if (GH.ro) { GH.ro.disconnect(); GH.ro = null; }
  GH.id = null; GH.def = null; GH.game = null; GH.canvas = null; GH.ctx = null;
  if (state.game) { state.game = null; $('#xmb').classList.remove('playing'); }
}

function gameResize() {
  const c = GH.canvas;
  if (!c) return;
  const r = c.getBoundingClientRect();
  if (!r.width) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  GH.ctx.setTransform(w / GH.def.W, 0, 0, h / GH.def.H, 0, 0);
}

function gameFrame(dt, t) {
  if (!GH.game || !GH.ctx) return;
  if (state.game && GH.game.update) GH.game.update(dt);
  GH.game.draw(GH.ctx, t);
}

function startGame() {
  if (!GH.game) return;
  state.game = GH.id;
  GH.game.start();
  sfx.confirm();
  place(); updateGameHud();
}

function stopGame(silent) {
  if (!state.game) return;
  state.game = null;
  if (GH.game) GH.game.prime();
  if (!silent) updateGameHud();
  place();
}

function gameAction() {
  const g = GH.game;
  if (!g) return;
  if (g.over || !g.playing) { g.start(); sfx.confirm(); updateGameHud(); return; }
  if (g.action) g.action();
}

function gameKey(k, down) {
  if (!GH.game) { state.game = null; return false; }
  if (down && (k === 'Escape' || k === 'Backspace' || k === 'o' || k === 'O')) { doBack(); return true; }
  if (down && (k === 'Enter' || k === 'x' || k === 'X' || k === ' ')) { gameAction(); return true; }
  if (GH.game.key) GH.game.key(k, down);
  return /^Arrow/.test(k) || k === 'PageUp' || k === 'PageDown';
}

function updateGameHud() {
  if (!GH.def || !GH.game) return;
  const g = GH.game, id = GH.id;
  if (g.score > (GH.best[id] || 0)) { GH.best[id] = g.score; store.set('xmb.best.v1', GH.best); }
  const set = (sel, v) => { const n = $(sel); if (n) n.textContent = v; };
  set('#g-score', g.score);
  set('#g-best', GH.best[id] || 0);
  set('#g-status', g.playing ? 'Playing' : g.over ? 'Game over' : 'Ready');
  set('#g-hint', 'Score: ' + g.score + ' · ' + (coarse ? GH.def.touch : GH.def.hint + ' · Enter to play/restart'));
  renderHints();
}

function bindBoard(c) {
  let sx = 0, sy = 0, swiped = false;
  const native = (e) => { const r = c.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * GH.def.W, ((e.clientY - r.top) / r.height) * GH.def.H]; };
  c.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    sx = e.clientX; sy = e.clientY; swiped = false;
    try { c.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
    const g = GH.game;
    if (!g) return;
    if (!state.game) { startGame(); return; }
    if (g.over) { g.start(); sfx.confirm(); updateGameHud(); return; }
    const [x, y] = native(e);
    if (g.pointer) g.pointer(x, y, 'down');
  });
  c.addEventListener('pointermove', (e) => {
    const g = GH.game;
    if (!g || !state.game) return;
    const [x, y] = native(e);
    if (g.pointer && (e.buttons || e.pointerType === 'mouse')) g.pointer(x, y, 'move');
    if (g.swipe && e.buttons && !(GH.def.swipeOnce && swiped)) {
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.hypot(dx, dy) > 26) { g.swipe(dx, dy); swiped = true; sx = e.clientX; sy = e.clientY; }
    }
  });
}

function overlayFx(ctx, now) {
  const k = bg.k, ac = accent.cur;
  ctx.globalCompositeOperation = 'lighter';
  if (bg.glow.x != null) {
    const gx = bg.glow.x * k, gy = bg.glow.y * k, r = 300 * k;
    const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, r);
    grad.addColorStop(0, rgba(ac, 0.07)); grad.addColorStop(1, rgba(ac, 0));
    ctx.fillStyle = grad; ctx.fillRect(gx - r, gy - r, r * 2, r * 2);

    const age = (now - p.t0) / 1000;
    if (age > 1.1) continue;
    ctx.beginPath(); ctx.arc(p.x * k, p.y * k, (16 + easeOut(age / 1.1) * 240) * k, 0, 6.283);
    ctx.strokeStyle = rgba(ac, 0.38 * (1 - age / 1.1)); ctx.lineWidth = 1.5 * k; ctx.stroke();

/* ---------- live thumbnails for Settings → Background ---------- */
const PV = { items: [], last: 0, active: false };
function startPreviews(body) {
  PV.items = $$('.fx', body).map((btn) => ({ id: btn.dataset.bg, canvas: $('canvas', btn), st: {} }));
  PV.active = true; PV.last = 0;
  requestAnimationFrame(sizePreviews);
}
function sizePreviews() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  PV.items.forEach((p) => {
    const r = p.canvas.getBoundingClientRect();
    p.canvas.width = Math.max(1, Math.round(r.width * dpr)); p.canvas.height = Math.max(1, Math.round(r.height * dpr));
    p.k = (r.width / window.innerWidth) * dpr * bg.q; p.dpr = dpr; p.st = {};
  });
}
function stopPreviews() { PV.active = false; PV.items = []; }
function previewFrame(now) {
  if (!PV.active || now - PV.last < 66) return;
  const dt = PV.last ? Math.min(8, (now - PV.last) / 16.667) : 1;
  PV.last = now;
  for (const p of PV.items) {
    if (!p.k || !p.canvas.isConnected) continue;
    const ctx = p.canvas.getContext('2d'), w = p.canvas.width, h = p.canvas.height;
    ctx.clearRect(0, 0, w, h);
    const fx = FX[p.id];
    if (!fx) continue;
    const minPx = 0.7 * p.dpr;
    ctx.save();
    fx(ctx, now, w, h, p.k, accent.cur, p.st, { dt, mx: null, my: null, pulses: [], now, cols: 36, preview: true, px: (v) => Math.max(v * p.k, minPx) });
    ctx.restore();
  }
}

function partyMode() {
  const again = !!earned.konami;
  bg.party = performance.now() + 9000;
  if (again) toast('Party mode', 'Up, Up, Down, Down…', svg24(ITEM_ICONS.theme));
}

/* ---------- main loop ---------- */
function frame(now) {
  bg.raf = requestAnimationFrame(frame);
  const dtMs = Math.min(100, now - (bg.last || now - 16.667));
  bg.last = now;
  const dt = dtMs / 16.667;
  bg.ema = bg.ema * 0.95 + dtMs * 0.05;
  if (bg.ema > 30 && bg.q > 0.6) { if (++bg.slow > 90) { bg.q = Math.max(0.6, bg.q - 0.2); bg.slow = 0; sizeCanvas(); } } else bg.slow = 0;

  if (bg.party > now) {
    const hex = hslToHex((now / 14) % 360, 85, 72);
    accent.target = hexToRgb(hex); root.style.setProperty('--accent', hex);
  } else if (bg.party) { bg.party = 0; applyAccent(settings.accent); }
  const e = 1 - Math.pow(0.002, dtMs / 500), c = accent.cur, tc = accent.target;
  c.r += (tc.r - c.r) * e; c.g += (tc.g - c.g) * e; c.b += (tc.b - c.b) * e;

  if (pointer.x != null) {
    if (bg.glow.x == null) { bg.glow.x = pointer.x; bg.glow.y = pointer.y; }
    const f = Math.min(1, 0.08 * dt);
    bg.glow.x += (pointer.x - bg.glow.x) * f; bg.glow.y += (pointer.y - bg.glow.y) * f;
  }

  const ctx = bg.ctx;
  ctx.clearRect(0, 0, bg.w, bg.h);
  const fx = FX[settings.bg];
  if (fx) {
    const st = bg.st[settings.bg] || (bg.st[settings.bg] = {});
    ctx.save();
    fx(ctx, reduceMotion ? now * 0.25 : now, bg.w, bg.h, bg.k, accent.cur, st, {
      dt: reduceMotion ? dt * 0.25 : dt, now, pulses: bg.pulses, cols: 110, preview: false,
      mx: pointer.x != null ? pointer.x * bg.k : null, my: pointer.y != null ? pointer.y * bg.k : null,
      px: (v) => v * bg.k,

    ctx.restore();
  }

  previewFrame(now);
}
function startLoop() { if (!bg.raf) { bg.last = 0; bg.raf = requestAnimationFrame(frame); } }
function stopLoop() { cancelAnimationFrame(bg.raf); bg.raf = 0; }

/* =====================================================================
   BOOT: a 1.5s intro (once per session, skippable with any input),
   then the crossbar, list and bars fade up into place.
   ===================================================================== */
let bootState = 0;
const booting = () => bootState === 1;
let introTimers = [];
function playIntro() {
  const xmb = $('#xmb');
  bootState = 1;
  xmb.classList.add('booting');
  introTimers.push(setTimeout(() => xmb.classList.add('boot-reveal'), 120));
  introTimers.push(setTimeout(finishIntro, 1500));
}
function finishIntro() {
  const xmb = $('#xmb');
  introTimers.forEach(clearTimeout); introTimers = [];
  bootState = 0;
  xmb.classList.remove('booting', 'boot-reveal');
  xmb.classList.add('boot-in');
  setTimeout(() => xmb.classList.remove('boot-in'), 1600);
}
function skipIntro() { if (bootState === 1) finishIntro(); }

function releaseGameKeys() {
  if (GH.game && GH.game.key) ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].forEach((k) => GH.game.key(k, false));
}

function boot() {
  bg.canvas = $('#bg');
  bg.ctx = bg.canvas.getContext('2d');
  applyAccent(settings.accent, true);
  buildXMB();
  const fontsReady = loadFonts();
  computeLayout();
  sizeCanvas();

  const route = routeFromHash();
  if (route) { state.cat = route.ci; if (route.j >= 0) state.sel[route.ci] = route.j; }
  place();
  tickClock();
  setTimeout(() => { tickClock(); setInterval(tickClock, 1000); }, 1000 - (Date.now() % 1000));

  const xmb = $('#xmb');
  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('wheel', onWheel, { passive: true });
  window.addEventListener('resize', onResize);
  window.addEventListener('popstate', onPopState);
  window.addEventListener('blur', releaseGameKeys);
  xmb.addEventListener('click', onClick);
  window.addEventListener('pointerdown', onPointerDown, { passive: true });
  window.addEventListener('pointermove', onPointerMove, { passive: true });
  window.addEventListener('pointerup', onPointerUp, { passive: true });
  window.addEventListener('pointercancel', onPointerUp, { passive: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopLoop(); releaseGameKeys(); } else startLoop(); });
  startLoop();

  const deep = !!(route && route.j >= 0);
  const wantIntro = settings.intro && !deep && !reduceMotion && !session.get('xmb.booted') && params.get('intro') !== '0';
  session.set('xmb.booted', '1');
  if (wantIntro) playIntro();
  else { xmb.classList.remove('booting'); xmb.classList.add('boot-in'); setTimeout(() => xmb.classList.remove('boot-in'), 1600); }
  if (deep) openPanel({ fromRoute: true, silent: true });

  fontsReady.then(() => {
    const tierChanged = computeLayout(); place();
    if (state.open) relayoutPanel(tierChanged);
  });

  setTimeout(() => award('hello'), wantIntro ? 3200 : 1800);
  const hr = new Date().getHours();
  if (hr < 5) setTimeout(() => award('owl'), 5200);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
